[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python main.py --api"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── API service ─────────────────────────────────────────────────────────
# The FastAPI server. Public-facing.
[[services]]
name = "api"
# Horizontal scaling: when running >1 replica of this service, set
# SCHEDULER_ENABLED=0 here and deploy the single-replica `scheduler` service
# below — otherwise every replica runs the embedded APScheduler and all 6
# cron jobs double-fire (N x LLM spend + duplicate writes). (Scale audit 2026-05-29.)
[services.variables]
START_MODE = "api"
# Worker queue lives on the same Redis Railway adds via the Redis plugin.
# Set REDIS_URL on the Railway dashboard (Redis plugin auto-injects it
# on services in the same project). The API process imports
# api/queue.py to enqueue work.
# REDIS_URL = "${REDIS_URL}"   # supplied by Redis plugin

# ── Worker pools (queue split by latency class) ──────────────────────────
# Headless RQ workers, independent of the API: redeploying the API doesn't
# restart them (and vice versa). ALWAYS (not ON_FAILURE) so a worker self-
# heals after a Redis/DB outage clears: api/worker.py pings Redis on boot and
# exits if it's down, so ON_FAILURE + a low retry cap would exhaust retries
# on a sustained outage and leave the worker permanently dead with no auto-
# recovery and no alert. (Scale audit 2026-05-29.)
#
# Two pools split work by latency class (P2-1) so a backlog of cheap batch
# jobs (scout's per-job g5_score + legitimacy_check fan-out) can't head-of-
# line-block a user waiting on a resume build:
#   - worker-interactive: drains the 'interactive' class (resume/interview/
#     LinkedIn/story/voice). Scale 1-2 replicas. OWNS the RQ scheduler
#     (RQ_RUN_SCHEDULER=1) — keep this pool at exactly 1 replica, or move the
#     scheduler to a dedicated single-replica worker, so scheduled jobs fire
#     once across the fleet (P2-2, the queue-side analogue of SCHEDULER_ENABLED).
#   - worker-batch: drains 'batch' + 'cron'. Scale horizontally (2-4 replicas).
#     RQ_RUN_SCHEDULER=0 so replicas don't double-fire scheduled jobs.
#
# Activating the split requires setting RQ_QUEUE_PREFIX on the API + both
# pools (e.g. "jobhunt") so enqueues and workers agree on the per-class queue
# names. Until RQ_QUEUE_PREFIX is set, every class resolves to the single
# 'jobhunt' queue and both pools simply drain it — behavior is identical to
# the old single 'worker' service, so this is safe to deploy before flipping
# the prefix on. WORKER_QUEUES defaults to all classes in api/worker.py, so
# even an un-split worker drains everything.
[[services]]
name = "worker-interactive"
[services.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
[services.deploy]
# No HTTP port — RQ worker is headless. Railway watches the process for
# liveness. ALWAYS for self-healing (see header above).
restartPolicyType = "ALWAYS"
[services.variables]
START_MODE = "worker"
# REDIS_URL = "${REDIS_URL}"   # supplied by Redis plugin (REQUIRED)
WORKER_CONCURRENCY = "1"
RQ_QUEUE_NAME = "jobhunt"
WORKER_QUEUES = "interactive"
# This pool OWNS the embedded RQ scheduler — keep it at 1 replica (P2-2).
RQ_RUN_SCHEDULER = "1"
# Enable the queue split by uncommenting on ALL of api + both worker pools:
# RQ_QUEUE_PREFIX = "jobhunt"

[[services]]
name = "worker-batch"
[services.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
[services.deploy]
# No HTTP port — headless. ALWAYS for self-healing (see header above).
restartPolicyType = "ALWAYS"
[services.variables]
START_MODE = "worker"
# REDIS_URL = "${REDIS_URL}"   # supplied by Redis plugin (REQUIRED)
WORKER_CONCURRENCY = "1"
RQ_QUEUE_NAME = "jobhunt"
WORKER_QUEUES = "batch,cron"
# Replicas of this pool must NOT run the scheduler, or scheduled jobs
# double-fire across the fleet (P2-2).
RQ_RUN_SCHEDULER = "0"
# Enable the queue split by uncommenting on ALL of api + both worker pools:
# RQ_QUEUE_PREFIX = "jobhunt"

# ── Reaper (optional) ───────────────────────────────────────────────────
# The orphan reaper can run either:
#   (a) embedded in the worker as an APScheduler thread (default — see
#       api/orphan_reaper.start_scheduler), OR
#   (b) as a separate cron service that fires `python -m api.orphan_reaper`
#       every 5 min via Railway's scheduled jobs.
# Option (a) is simpler; option (b) survives worker container crashes
# better. Pick one. Today we ship (a) — uncomment below to flip to (b).
#
# [[services]]
# name = "reaper-cron"
# [services.build]
# builder = "DOCKERFILE"
# dockerfilePath = "Dockerfile.worker"
# [services.deploy]
# # Cron syntax via Railway's scheduled-jobs feature, every 5 min.
# # Set this in the Railway UI under the service's "Cron" tab.
# startCommand = "python -m api.orphan_reaper"
# [services.variables]
# # REDIS_URL = "${REDIS_URL}"
# LOG_LEVEL = "INFO"

# ── Scheduler service ───────────────────────────────────────────────────
# Runs the 6 APScheduler cron jobs (job_scout, boss_agent, persona_synthesis,
# daily cost alert, weekly cost digest, g6_followup) as ONE dedicated process.
# Deploy at exactly 1 replica.
#
# The same cron is ALSO embedded in the `api` service by default
# (SCHEDULER_ENABLED defaults on) so a one-service deployment still runs cron
# (BUG-053). The moment you scale `api` to >1 replica, deploy THIS service and
# set SCHEDULER_ENABLED=0 on `api`, so cron fires exactly once across the fleet.
[[services]]
name = "scheduler"
[services.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
[services.deploy]
startCommand = "python main.py --scheduler"
restartPolicyType = "ALWAYS"
[services.variables]
START_MODE = "scheduler"
SCHEDULER_ENABLED = "1"
# REDIS_URL = "${REDIS_URL}"   # supplied by Redis plugin
