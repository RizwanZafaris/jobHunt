[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-job-scan"
version = "0.1.0"
description = "Static-analysis scanner for the jobHunt bug classes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jobHunt platform" }]
dependencies = []  # zero deps by design

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pr-job-scan = "pr_job_scan.cli:main"

[tool.setuptools.packages.find]
include = ["pr_job_scan*"]
